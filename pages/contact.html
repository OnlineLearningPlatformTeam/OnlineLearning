<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>onlinelearning</title>

</head>

<body class="bg-white font-sans text-slate-700">

  <!-- navbar -->

  <header class="top-0 z-50 border-b border-slate-200 bg-white fixed w-full">
    <nav class="mx-auto flex max-w-7xl flex-wrap items-center justify-between px-4 py-3 sm:px-6"
      aria-label="Main navigation">

      <!-- Logo -->
      <div class="flex items-center gap-2 md:order-1">
        <button id="menu-btn" type="button"
          class="rounded-md px-3 py-2 text-xl hover:bg-soft focus:outline-none focus-visible:ring-2 focus-visible:ring-secondary md:hidden"
          aria-controls="menu" aria-expanded="false" aria-label="Open menu">
          <span id="icon-open"><i class="fa-solid fa-bars" aria-hidden="true"></i></span>
          <span id="icon-close" class="hidden"><i class="fa-solid fa-xmark" aria-hidden="true"></i></span>
        </button>

        <a href="#"
          class="flex items-center gap-2 text-2xl font-semibold focus:outline-none focus-visible:ring-2 focus-visible:ring-secondary">
          <span class="grid size-8 place-items-center rounded-lg bg-indigo-600 text-white">
            <i class="fa-solid fa-graduation-cap text-[15px]" aria-hidden="true"></i>
          </span>
          <span class="text-xl font-semibold text-blue-700">Learning</span>
        </a>
      </div>

      <!-- Right side: icons + CTA (desktop) + hamburger (mobile) -->
      <div class="flex items-center gap-3 md:order-3">
        <span
          class="flex bg-blue-50 hover:bg-blue-100 transition-colors w-10 h-10 rounded-md items-center justify-center cursor-pointer">
          <i class="fa-solid fa-magnifying-glass text-blue-600"></i>
        </span>
        <span
          class="flex bg-blue-50 hover:bg-blue-100 transition-colors w-10 h-10 rounded-md items-center justify-center cursor-pointer relative">
          <i class="fa-regular fa-bell text-blue-600"></i>
          <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></span>
        </span>
        <a href="#"
          class="hidden md:inline-block bg-blue-500 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-blue-600 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-secondary">
          Explore Courses
        </a>

        <!-- Hamburger button (mobile only) -->
        <!-- <button id="menu-btn" type="button"
          class="rounded-md px-3 py-2 text-xl text-primary hover:bg-soft focus:outline-none focus-visible:ring-2 focus-visible:ring-secondary md:hidden"
          aria-controls="menu" aria-expanded="false" aria-label="Open menu">
          <span id="icon-open"><i class="fa-solid fa-bars" aria-hidden="true"></i></span>
          <span id="icon-close" class="hidden"><i class="fa-solid fa-xmark" aria-hidden="true"></i></span>
        </button> -->
      </div>

      <!-- Menu: dropdown on mobile, row on desktop -->
      <ul id="menu"
        class="order-4 mt-3 hidden w-full flex-col gap-1 overflow-hidden md:order-2 md:mt-0 md:flex md:w-auto md:flex-row md:items-center">
        <li>
          <a href="#" aria-current="page"
            class="flex items-center gap-2 rounded-md bg-soft px-4 py-2 text-sm font-medium text-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-secondary">
            <span class="md:hidden"><i class="fa-solid fa-house" aria-hidden="true"></i></span> Home
          </a>
        </li>
        <li>
          <a href="#"
            class="flex items-center gap-2 rounded-md px-4 py-2 text-sm font-medium text-slate-600 transition-colors hover:bg-soft hover:text-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-secondary">
            <span class="md:hidden"><i class="fa-solid fa-circle-info" aria-hidden="true"></i></span> About
          </a>
        </li>
        <li>
          <a href="#"
            class="flex items-center gap-2 rounded-md px-4 py-2 text-sm font-medium text-slate-600 transition-colors hover:bg-soft hover:text-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-secondary">
            <span class="md:hidden"><i class="fa-solid fa-book-open" aria-hidden="true"></i></span> Courses
          </a>
        </li>
        <li>
          <a href="#"
            class="flex items-center gap-2 rounded-md px-4 py-2 text-sm font-medium text-slate-600 transition-colors hover:bg-soft hover:text-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-secondary">
            <span class="md:hidden"><i class="fa-solid fa-envelope" aria-hidden="true"></i></span> Contact
          </a>
        </li>
        <!-- CTA shown in mobile menu only -->
        <li class="mt-2 md:hidden">
          <a href="#"
            class="block w-full text-center bg-blue-500 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-blue-600 transition-colors">
            Explore Courses
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <script src="https://kit.fontawesome.com/a39746915c.js" crossorigin="anonymous"></script>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
